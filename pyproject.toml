[project]
name = "whut-admissions-rag"
version = "0.1.0"
description = "武汉理工大学本科招生最小 RAG 验证链路"
requires-python = ">=3.11,<3.12"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "chromadb>=1.0,<2",
  "httpx>=0.28,<0.29",
  "pdfplumber>=0.11,<0.12",
  "pydantic>=2.10,<3",
  "streamlit>=1.45,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

